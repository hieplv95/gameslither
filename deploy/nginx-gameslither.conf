# Nginx đứng trước GameSlither: nhận HTTP/HTTPS + WebSocket rồi chuyển vào Node (127.0.0.1:3000).
# setup.sh sẽ thay gameslither.io bằng domain của bạn và certbot sẽ tự thêm phần HTTPS (443).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name gameslither.io www.gameslither.io;

    # www và không www cùng trả về 1 trang; thẻ canonical trên trang đã trỏ về https://gameslither.io
    # (không redirect ở đây để certbot xác minh được cả www).

    client_max_body_size 10m;   # tải ảnh blog lên trang quản trị (Node tự giới hạn từng API)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket (game chạy qua đây)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        # Ghi đè (không nối thêm) để người chơi không giả được IP.
        # Nếu dùng Cloudflare, file cloudflare-realip.conf đổi $remote_addr thành IP thật của khách.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
